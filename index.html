<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Live Radio...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #ffd700;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Live Radio Stream</h1>
        <p>Redirecting you to the live stream...</p>
        <div class="spinner"></div>
        <p>If not redirected within 3 seconds, <a id="manual-link">click here</a></p>
    </div>

    <script>
        // ================= CONFIGURATION =================
        const YOUTUBE_URL = 'https://www.youtube.com/watch?v=rFZHOHl-L8A'; // REPLACE THIS
        const API_URL = 'https://live-radio-click-tracker.your-subdomain.workers.dev'; // REPLACE WITH YOUR WORKER URL
        const MAX_CLICKS = 2;
        const TIME_WINDOW_MS = 24 * 60 * 60 * 1000; // 24 hours
        // =================================================

        // Get location from URL parameter (e.g., ?location=manila)
        const urlParams = new URLSearchParams(window.location.search);
        const loc = urlParams.get('location') || 'unknown';

        // Create unique device identifier (fingerprint)
        function getDeviceId() {
            const userAgent = navigator.userAgent;
            const language = navigator.language;
            const platform = navigator.platform;
            const screenResolution = `${screen.width}x${screen.height}`;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const colorDepth = screen.colorDepth;
            
            const fingerprint = `${userAgent}|${language}|${platform}|${screenResolution}|${timezone}|${colorDepth}`;
            return btoa(fingerprint);
        }

        // Track click locally and return count info
        function trackClickLocally() {
            const deviceId = getDeviceId();
            const storageKey = `radio_click_${deviceId}_${loc}`;
            const now = Date.now();

            let clickData = {
                count: 0,
                firstClickTime: now,
                lastClickTime: now,
                isWithinLimit: true
            };

            const stored = localStorage.getItem(storageKey);

            if (stored) {
                const data = JSON.parse(stored);
                const timeSinceFirstClick = now - data.firstClickTime;

                if (timeSinceFirstClick > TIME_WINDOW_MS) {
                    clickData = {
                        count: 1,
                        firstClickTime: now,
                        lastClickTime: now,
                        isWithinLimit: true
                    };
                } else {
                    clickData = {
                        count: data.count + 1,
                        firstClickTime: data.firstClickTime,
                        lastClickTime: now,
                        isWithinLimit: (data.count + 1) <= MAX_CLICKS
                    };
                }
            } else {
                clickData = {
                    count: 1,
                    firstClickTime: now,
                    lastClickTime: now,
                    isWithinLimit: true
                };
            }

            localStorage.setItem(storageKey, JSON.stringify(clickData));
            return clickData;
        }

        // Send click data to Cloudflare Worker
        async function trackClickOnServer(clickData) {
            const deviceId = getDeviceId();
            
            const data = {
                location: loc,
                deviceId: deviceId,
                clickCount: clickData.count,
                isWithinLimit: clickData.isWithinLimit,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };

            try {
                const response = await fetch(`${API_URL}/track-click`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    console.log('✅ Click tracked successfully');
                } else {
                    console.error('❌ Failed to track click');
                }
            } catch (error) {
                console.error('Worker error:', error);
                console.log(`[LOCAL LOG] Location: ${location}, Click #${clickData.count}`);
            }
        }

        // Main redirect function
        function redirect() {
            const clickData = trackClickLocally();
            trackClickOnServer(clickData);

            document.getElementById('manual-link').href = YOUTUBE_URL;

            setTimeout(() => {
                window.location.href = YOUTUBE_URL;
            }, 500);
        }

        redirect();
    </script>
</body>
</html>
